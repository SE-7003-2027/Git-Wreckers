<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecomendaBook</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>RecomendaBook</h1>
    <p>Descubre libros, comics y manga disponibles en Mexico</p>
  </header>

  <main>
    <section class="filtros">
      <button class="filtro activo" data-tipo="">Todos</button>
      <button class="filtro" data-tipo="libro">Libros</button>
      <button class="filtro" data-tipo="manga">Manga</button>
      <button class="filtro" data-tipo="comic">Comics</button>
    </section>

    <p id="estado" class="estado">Cargando catalogo...</p>

    <section id="catalogo" class="catalogo"></section>
  </main>

  <footer class="site-footer">
    <p>Demo funcional &middot; RecomendaBook &middot; Git-Wreckers Team 1</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
